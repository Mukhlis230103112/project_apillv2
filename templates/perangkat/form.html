{% extends "base.html" %}

{% if edit %}
    {% set judul = "Edit Perangkat" %}
{% else %}
    {% set judul = "Tambah Perangkat" %}
{% endif %}

{% block title %}
{{ judul }} - Inventaris APILL
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1 class="page-title">
            {{ judul }}
        </h1>

        <p class="page-subtitle">
            Kelola inventaris perangkat APILL
        </p>
    </div>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-group">

            <label>Simpang</label>

            <select name="id_simpang" required>

                <option value="">
                    -- Pilih Simpang --
                </option>

                {% for s in simpang %}

                <option
                    value="{{ s[0] }}"
                    {% if edit and data[1] == s[0] %}
                        selected
                    {% endif %}
                >
                    {{ s[1] }} - {{ s[2] }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>Jenis Perangkat</label>

            <input
                type="text"
                name="jenis_perangkat"
                value="{{ data[2] if edit else '' }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Jenis / Ukuran</label>

            <input
                type="text"
                name="jenis_ukuran"
                value="{{ data[3] if edit else '' }}"
            >

        </div>


        <div class="form-group">

            <label>Daya</label>

            <input
                type="text"
                name="daya"
                value="{{ data[4] if edit else '' }}"
            >

        </div>


        <div class="form-group">

            <label>Sistem</label>

            <input
                type="text"
                name="sistem"
                value="{{ data[5] if edit else '' }}"
            >

        </div>


        <div class="form-group">

            <label>Komunikasi</label>

            <input
                type="text"
                name="komunikasi"
                value="{{ data[6] if edit else '' }}"
            >

        </div>


        <div class="form-group">

            <label>Jumlah</label>

            <input
                type="number"
                name="jumlah"
                min="0"
                value="{{ data[7] if edit else '' }}"
            >

        </div>


        <div class="form-group">

            <label>Kondisi</label>

            <input
                type="text"
                name="kondisi"
                value="{{ data[8] if edit else '' }}"
            >

        </div>


        <div class="form-group">

            <label>Keterangan</label>

            <textarea
                name="keterangan"
            >{{ data[9] if edit else '' }}</textarea>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="button">
                Simpan
            </button>

            <a
                href="{{ url_for('perangkat.index') }}"
                class="button btn-secondary">
                Batal
            </a>

        </div>

    </form>

</div>

{% endblock %}
